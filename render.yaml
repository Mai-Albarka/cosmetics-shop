# One-click setup for Render.com: New + > Blueprint > connect this repo.
services:
  - type: web
    name: man-and-brothers-cosmetics
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: shop-data
      mountPath: /var/data
      sizeGB: 1
